name: Release Signed APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
          gradle-version: '8.9'

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Erro: um ou mais GitHub Secrets obrigatorios estao vazios."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fuel-release.jks"

      - name: Build Signed Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/fuel-release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify APK Signature and Package Assets
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs --verbose app/build/outputs/apk/release/app-release.apk
          TAG_NAME="${GITHUB_REF_NAME}"
          APK_OUT="Fuel-${TAG_NAME}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_OUT"
          sha256sum "$APK_OUT" > "${APK_OUT}.sha256"

      - name: Cleanup Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/fuel-release.jks"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Fuel-${{ github.ref_name }}-release.apk
            Fuel-${{ github.ref_name }}-release.apk.sha256