name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Validar sintaxe YAML dos workflows
        run: |
          for arq in .github/workflows/build.yml .github/workflows/release.yml .github/dependabot.yml; do
            npx --yes js-yaml@4.1.0 "$arq" > /dev/null
          done

      - name: Run calculation engine and metadata tests
        run: node --test tests/*.test.mjs

      - name: Verificar cópias duplicadas do PWA (raiz e APK)
        run: |
          for f in index.html manifest.json service-worker.js icon-192.png icon-512.png; do
            cmp "$f" "app/src/main/assets/www/$f"
          done

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Build Debug APK
        run: |
          for tentativa in 1 2 3; do
            if ./gradlew testDebugUnitTest assembleDebug; then exit 0; fi
            echo "Tentativa $tentativa falhou (possível limite de taxa do repositório Maven). Aguardando 90 s."
            sleep 90
          done
          exit 1

      - name: Lint (informativo)
        continue-on-error: true
        run: ./gradlew lintDebug

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Verificar disponibilidade dos Secrets de assinatura
        id: assinatura
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "disponivel=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Secrets indisponíveis neste pull request (ex.: Dependabot); a assinatura do release é ignorada."
            echo "disponivel=false" >> "$GITHUB_OUTPUT"
          else
            echo "Erro: um ou mais GitHub Secrets obrigatorios estao vazios."
            exit 1
          fi

      - name: Decode Release Keystore
        if: steps.assinatura.outputs.disponivel == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fuel-release.jks"

      - name: Build Signed Release APK
        if: steps.assinatura.outputs.disponivel == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/fuel-release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for tentativa in 1 2 3; do
            if ./gradlew assembleRelease; then exit 0; fi
            echo "Tentativa $tentativa falhou (possível limite de taxa do repositório Maven). Aguardando 90 s."
            sleep 90
          done
          exit 1

      - name: Verify APK Signature and SHA-256
        if: steps.assinatura.outputs.disponivel == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Cleanup Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/fuel-release.jks"

      - name: Upload Debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
