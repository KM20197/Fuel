name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  web-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run calculation engine tests
        run: node --test tests/engine.test.mjs

      - name: Verificar cópias duplicadas do PWA (raiz e APK)
        run: |
          for f in index.html manifest.json service-worker.js; do
            diff -u "$f" "app/src/main/assets/www/$f"
          done

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        run: |
          for tentativa in 1 2 3; do
            if ./gradlew testDebugUnitTest assembleDebug; then exit 0; fi
            echo "Tentativa $tentativa falhou (possível limite de taxa do repositório Maven). Aguardando 90 s."
            sleep 90
          done
          exit 1

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Erro: um ou mais GitHub Secrets obrigatorios estao vazios."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fuel-release.jks"

      - name: Build Signed Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/fuel-release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for tentativa in 1 2 3; do
            if ./gradlew assembleRelease; then exit 0; fi
            echo "Tentativa $tentativa falhou (possível limite de taxa do repositório Maven). Aguardando 90 s."
            sleep 90
          done
          exit 1

      - name: Verify APK Signature and SHA-256
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs --verbose app/build/outputs/apk/release/app-release.apk

      - name: Cleanup Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/fuel-release.jks"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
